name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7969ecaa0a1b9bacae1861547c2ec3fe
        run: |
          # プロジェクトが無ければ作成（初回のみ。既存ならスキップ）
          npx wrangler@3 pages project create hoshiyomi --production-branch=main || true
          npx wrangler@3 pages deploy public --project-name=hoshiyomi --branch=${{ github.ref_name }} --commit-dirty=true
