<script>
(function(){
  var intro=document.getElementById('sv-intro');
  if(!intro) return;
  var video=document.getElementById('sv-intro-video');
  var logo=document.getElementById('sv-intro-logo');
  var skip=document.getElementById('sv-intro-skip');
  var done=false, ended=false;
  document.body.classList.add('sv-intro-open');

  function finish(){
    if(done) return; done=true;
    intro.classList.add('is-hiding');
    document.body.classList.remove('sv-intro-open');
    setTimeout(function(){ intro.classList.add('is-done'); try{video.pause();}catch(e){} }, 900);
  }
  function showLogo(){
    if(ended||done) return; ended=true;
    video.classList.remove('is-in'); video.classList.add('is-out');
    setTimeout(function(){
      logo.classList.add('is-in');
      setTimeout(finish, 1900); // ロゴの保持時間
    }, 650);
  }
  function startVideo(){
    requestAnimationFrame(function(){ video.classList.add('is-in'); });
    var p=video.play();
    if(p&&p.catch) p.catch(function(){ showLogo(); }); // 自動再生不可→ロゴへ
  }

  skip.addEventListener('click', finish);
  video.addEventListener('ended', showLogo);
  video.addEventListener('timeupdate', function(){
    if(video.duration && video.currentTime >= video.duration - 0.55) showLogo();
  });
  video.addEventListener('error', showLogo, {once:true});
  setTimeout(function(){ if(!ended&&!done) showLogo(); }, 9000); // 安全弁

  if(video.readyState>=2) startVideo();
  else {
    video.addEventListener('canplay', startVideo, {once:true});
    video.addEventListener('loadeddata', startVideo, {once:true});
  }
})();
</script>
